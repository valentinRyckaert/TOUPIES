name: Release

# Publication : pousser un tag « vX.Y.Z » construit, teste et publie les
# paquets Linux (AppImage), Windows (zip) et macOS (dmg) dans une release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  QT_QPA_PLATFORM: offscreen
  CTEST_OUTPUT_ON_FAILURE: "1"

jobs:
  package:
    name: Paquet ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installation de Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          cache: true

      - name: Environnement MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Dépendances Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libgl1-mesa-dev \
            libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0 file

      - name: Ninja (Windows / macOS)
        if: runner.os != 'Linux'
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Compilation
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Tests
        run: ctest --test-dir build --timeout 300

      - name: Paquet Linux (AppImage)
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          DESTDIR=AppDir cmake --install build --prefix /usr
          mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps
          cp packaging/toupie-arena.svg AppDir/usr/share/icons/hicolor/scalable/apps/
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          export QMAKE="$(command -v qmake6 || command -v qmake)"
          export EXTRA_PLATFORM_PLUGINS="libqoffscreen.so"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt \
            --desktop-file packaging/toupie-arena.desktop \
            --icon-file packaging/toupie-arena.svg --output appimage
          mv Toupie_Arena*.AppImage ToupieArena-${{ github.ref_name }}-linux-x86_64.AppImage
          ./ToupieArena-*.AppImage --smoke-test

      - name: Paquet Windows (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/src/toupie_arena.exe dist/
          windeployqt --release --no-translations --no-opengl-sw dist/toupie_arena.exe
          ./dist/toupie_arena.exe --smoke-test | Out-Null
          Compress-Archive -Path dist/* -DestinationPath "ToupieArena-${{ github.ref_name }}-windows-x64.zip"

      - name: Paquet macOS (dmg)
        if: runner.os == 'macOS'
        run: |
          macdeployqt build/src/toupie_arena.app -dmg
          ./build/src/toupie_arena.app/Contents/MacOS/toupie_arena --smoke-test
          mv build/src/toupie_arena.dmg "ToupieArena-${{ github.ref_name }}-macos.dmg"

      - name: Archive du paquet
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}
          path: |
            ToupieArena-*.AppImage
            ToupieArena-*.zip
            ToupieArena-*.dmg
          if-no-files-found: error

  publish:
    name: Publication de la release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          generate_release_notes: true
