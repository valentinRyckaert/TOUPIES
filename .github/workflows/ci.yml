name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen   # Tests d'interface sans affichage.
  CTEST_OUTPUT_ON_FAILURE: "1"

jobs:
  # Version minimale supportée (Qt 6.4 des dépôts Ubuntu), avertissements = erreurs.
  linux-system-qt:
    name: Linux · Qt système · ${{ matrix.build_type }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ qt6-base-dev qt6-base-dev-tools qt6-tools-dev qt6-tools-dev-tools \
            qt6-l10n-tools qt6-multimedia-dev libgl1-mesa-dev libxkbcommon-dev

      - name: Configuration
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DTOUPIE_WERROR=ON

      - name: Compilation
        run: cmake --build build --parallel

      - name: Tests unitaires et d'intégration
        run: ctest --test-dir build --timeout 300

      - name: Test de démarrage de l'application
        run: ./build/src/toupie_arena --smoke-test

      - name: Simulateur d'équilibrage (fumée)
        run: ./build/tools/toupie_balance_sim -n 5 -r 300 -s all

  # Analyse dynamique : AddressSanitizer + UndefinedBehaviorSanitizer.
  sanitizers:
    name: Linux · ASan + UBSan
    runs-on: ubuntu-24.04
    env:
      ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ qt6-base-dev qt6-base-dev-tools qt6-tools-dev qt6-tools-dev-tools \
            qt6-l10n-tools qt6-multimedia-dev libgl1-mesa-dev libxkbcommon-dev

      - name: Configuration
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DTOUPIE_BUILD_TOOLS=OFF
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"

      - name: Compilation
        run: cmake --build build --parallel

      - name: Tests
        run: ctest --test-dir build --timeout 600

  # Qt récent (LTS) sur les trois systèmes.
  qt-lts:
    name: ${{ matrix.os }} · Qt 6.8
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Les runners macOS (arm64) de GitHub sont souvent saturés : un échec
    # d'attribution du runner ne doit pas faire échouer toute la CI.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Installation de Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          modules: qtmultimedia
          cache: true

      - name: Environnement MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Dépendances Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0

      - name: Ninja (Windows / macOS)
        if: runner.os != 'Linux'
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configuration
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Compilation
        run: cmake --build build --parallel

      - name: Tests unitaires et d'intégration
        run: ctest --test-dir build --timeout 300

      - name: Pile d'appels en cas de plantage (macOS)
        if: failure() && runner.os == 'macOS'
        run: |
          for t in build/tests/tst_*; do
            [ -f "$t" ] && [ -x "$t" ] || continue
            echo "::group::$t"
            lldb --batch -o run -k "bt all" -k quit -- "$t" 2>&1 | tail -120
            echo "::endgroup::"
          done

      # Un test qui s'arrête sans rien afficher sous Windows : sa sortie, détaillée, va
      # dans un fichier (pas la console), pour voir la dernière fonction commencée.
      - name: Détail des tests en cas d'échec (Windows)
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($t in Get-ChildItem build -Recurse -File -Filter "tst_*.exe") {
            Write-Output "::group::$($t.Name)"
            $log = "$($t.BaseName).log"
            & $t.FullName -v2 -o "$log,txt"
            Write-Output "code de sortie : $LASTEXITCODE"
            if (Test-Path $log) {
              Select-String -Path $log -Pattern 'FAIL!|QWARN|QFATAL' -Context 2,4 | ForEach-Object { $_.ToString() }
              Get-Content $log | Select-Object -Last 15
            }
            Write-Output "::endgroup::"
          }

      - name: Archive du binaire
        uses: actions/upload-artifact@v4
        with:
          name: top-arena-${{ matrix.os }}
          path: |
            build/src/toupie_arena
            build/toupie_arena.exe
            build/src/toupie_arena.app
          if-no-files-found: error
          retention-days: 7
